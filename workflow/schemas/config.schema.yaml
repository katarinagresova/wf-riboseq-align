$schema: "https://json-schema.org/draft/2020-12/schema"
description: wf-riboseq-align config. config/config.yaml documents each key.
type: object
additionalProperties: false
properties:
  samples:
    type: string
  RESULTS_DIR:
    type: string
    default: results
  LOG_DIR:
    type: string
    default: logs
  adapter:
    type: string
  minlength:
    type: integer
    minimum: 0
  maxlength:
    type: integer
    minimum: 0
  qualcutoff:
    type: integer
    minimum: 0
  contaminants_fa:
    type: string
  human_transcriptome_fa:
    type: string
  spike_in_transcriptome_fa:
    type: string
  min_spike_in_fraction:
    type: number
    minimum: 0
    maximum: 1
    default: 0.01
required:
  - samples
  - adapter
  - minlength
  - maxlength
  - qualcutoff
  - human_transcriptome_fa
  - spike_in_transcriptome_fa
