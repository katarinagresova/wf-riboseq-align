# Lint, dry run and a full run on the synthetic test data in .test/ (see .test/make_data.py).
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: snake
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install Snakemake
        run: conda install -y "snakemake=9.11.6" pandas
      - name: Lint
        run: snakemake -s workflow/Snakefile --directory .test --lint
      - name: Dry run
        run: snakemake -s workflow/Snakefile --directory .test -n
      - name: Run on the test data
        run: snakemake -s workflow/Snakefile --directory .test --use-conda --cores 2 --show-failed-logs
      # make_data.py builds both cases in; a 0 means a change stopped exercising them
      - name: Check that the test data has multi-contaminant and both-species reads
        run: >-
          awk -F'\t' 'FNR == 1 {for (i = 1; i <= NF; i++) col[$i] = i; next}
          !$col["contaminant_multi"] || !$col["both_species"] {print FILENAME ": " $1 " has none"; bad = 1}
          END {exit bad}' .test/results/*/qc/summary.tsv
      # the pre-mRNA reads: a 0 means salmon's decoys caught nothing
      - name: Check that salmon assigned fragments to decoys
        run: >-
          for f in .test/results/*/salmon/*/aux_info/meta_info.json; do
          grep -q '"num_decoy_fragments": [1-9]' $f || { echo "$f has none"; exit 1; }; done
