# wf-riboseq-align configuration. Paths are relative to where snakemake runs
# (the repo root when standalone, the importing repo's root when used as a module).

samples: "config/samples.csv"
RESULTS_DIR: "results"
LOG_DIR: "logs"

# Ribo-seq adapter trimming (cutadapt_reads). minlength / maxlength are of the
# insert, i.e. the read without its 4+4 nt randomers (cutadapt gets them + 8).
adapter: "TGGAATTCTCGGGTGCCAAGG"
minlength: 18
maxlength: 100
qualcutoff: 20

# rRNA / tRNA / snRNA ... A Ribo-seq read that aligns to one (sense) is
# discarded only if that alignment has at most as many mismatches as its best
# sense alignment to the transcriptome (bowtie_align). A tie stays discarded.
# Not set: the set this repo ships, resources/contaminants_built.fa
# (build_contaminants). A fasta of your own goes into the bowtie index as is: it
# needs record names unique across it and the transcriptomes, and each sequence
# once (bowtie_index errors otherwise).
# contaminants_fa: "/path/to/contaminants.fa"

# Transcriptomes. The Ribo-seq reads are mapped to both at once (human +
# spike-in), then split by species.
human_transcriptome_fa: "/path/to/human_transcriptome.fa"
spike_in_transcriptome_fa: "/path/to/yeast_transcriptome.fa"

# qc_summary fails if any Ribo-seq library has a lower spike-in fraction
# (spike-in-only reads / all mapped reads). Set 0 for libraries without a
# spike-in (e.g. HarrPurr).
min_spike_in_fraction: 0.01
