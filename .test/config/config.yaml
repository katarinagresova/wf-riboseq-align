# Test run on the synthetic data in ../data: random sequences, not real reads
# (written by ../make_data.py). Run from the repo root:
#   snakemake -s workflow/Snakefile --directory .test --use-conda --cores 2
# Paths are relative to .test/. samples.csv's read_type=rna rows check that the
# workflow skips them.

samples: "config/samples.csv"
RESULTS_DIR: "results"
LOG_DIR: "logs"

adapter: "TGGAATTCTCGGGTGCCAAGG"
minlength: 18
maxlength: 100
qualcutoff: 20

contaminants_fa: "data/contaminants.fa"
human_transcriptome_fa: "data/human.fa"
spike_in_transcriptome_fa: "data/yeast.fa"

min_spike_in_fraction: 0.01
